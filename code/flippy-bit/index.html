<!doctype html>
<html>
    <head>
        <title>FIT2102 A1 2026</title>
    </head>
    <body>
        <h1>Flippy Bit</h1>
        <main id="main" class="flex col">
            <svg id="svgCanvas" width="600" height="400">
                <g id="gameOver" visibility="hidden">
                    <rect
                        x="225"
                        y="176"
                        fill="white"
                        height="48"
                        width="150"
                    ></rect>
                    <text x="235" y="206">Game Over</text>
                </g>
            </svg>
            <div id="sideBar" class="flex col">
                <!--Game State Information-->
                <div id="info" class="flex col">
                    <div class="text">
                        <span class="left">
                            Score:
                        </span>

                        <span
                            class="right"
                            id="scoreText"
                        >
                            0
                        </span>
                    </div>

                    <div class="text">
                        <span class="left">
                            Hex :
                        </span>

                        <span
                            class="right"
                            id="answerText"
                        >
                            00000000
                        </span>
                    </div>

                    <div class="text">
                        <span class="left">
                            Status:
                        </span>

                        <span
                            class="right"
                            id="statusText"
                        >
                            Ready
                        </span>
                    </div>
                </div>
                <!--Game State Control Button:-->
                <div class="flex row">
                    <button id="pauseButton">
                        Pause (P)
                    </button>

                    <button id="restartButton">
                        Restart (R)
                    </button>
                </div>
            </div>
        </main>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
